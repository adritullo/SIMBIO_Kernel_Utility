# Builds the app for Windows, macOS (Apple Silicon + Intel) and Linux on GitHub's runners.
#   * every push / pull request / manual run : tests + build, artifacts attached to the run
#   * push of a tag like v0.3.0              : also publishes a GitHub Release with the four downloads
name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to create the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: windows-x64,  os: windows-latest}
          - {name: macos-arm64,  os: macos-15}      # macos-14 was retired by GitHub on 2026-11-02
          - {name: macos-x64,    os: macos-15-intel}   # Intel Macs; if GitHub renames the label, pick another x86_64 macOS runner
          - {name: linux-x64,    os: ubuntu-22.04}     # oldest glibc we build on => runs on newer distros too
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: System libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 libfontconfig1

      - run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Build
        run: pyinstaller --noconfirm --clean SimbioKernelUtility.spec

      - name: Smoke-test the built app (Qt + CSPICE + bundled resources)
        run: python scripts/smoke_test.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = python -c "import simbio_utility; print(simbio_utility.__version__)"
          Compress-Archive -Path dist/SimbioKernelUtility.exe -DestinationPath "dist/SimbioKernelUtility-$v-${{ matrix.name }}.zip"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          v=$(python -c "import simbio_utility; print(simbio_utility.__version__)")
          cd dist && ditto -c -k --keepParent SimbioKernelUtility.app "SimbioKernelUtility-$v-${{ matrix.name }}.zip"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          v=$(python -c "import simbio_utility; print(simbio_utility.__version__)")
          cd dist && tar -czf "SimbioKernelUtility-$v-${{ matrix.name }}.tar.gz" SimbioKernelUtility

      - uses: actions/upload-artifact@v7
        with:
          name: SimbioKernelUtility-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          generate_release_notes: true
